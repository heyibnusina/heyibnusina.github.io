<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalkulator Compounding @heyibnusina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#2dd4bf; --teal-deep:#0f766e; --ink:#06201f; --ink-2:#0b2e2c;
    --paper:#ffffff; --muted:#5b7270; --line:#dbe9e7;
    --bg:#06201f; --text:#ffffff; --text-soft:#a9c4c1;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#effaf8; --text:#06201f; --text-soft:#4c6b68; color-scheme: light; }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:56px 20px;
  }
  .wrap{width:100%; max-width:760px; text-align:center}

  .tickers{display:flex; justify-content:center; flex-wrap:wrap; margin-bottom:28px}
  .tickers .ico{
    width:52px; height:52px; border-radius:50%; background:#fff; border:3px solid var(--bg);
    margin-left:-10px; display:grid; place-items:center; overflow:hidden;
    font-size:10px; font-weight:800; color:var(--ink);
    animation:float 5s ease-in-out infinite;
  }
  .tickers .ico:first-child{margin-left:0}
  .tickers .ico:nth-child(even){animation-delay:-2.5s}
  .tickers img{width:100%; height:100%; object-fit:cover; display:block}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

  h1{font-size:clamp(28px,5.2vw,46px); line-height:1.12; letter-spacing:-.02em; font-weight:800; margin:0 0 12px}
  .sub{font-size:clamp(15px,2.2vw,18px); color:var(--text-soft); margin:0 0 36px}

  .card{
    background:var(--paper); color:var(--ink); border-radius:28px;
    padding:clamp(22px,4vw,40px); text-align:left;
    box-shadow:0 30px 80px -30px rgba(0,0,0,.55);
  }
  .row{display:flex; align-items:baseline; flex-wrap:wrap; gap:10px 14px; font-size:clamp(18px,2.6vw,22px); font-weight:600}
  .row + .row{margin-top:18px}
  .amount{
    display:inline-flex; align-items:baseline; gap:2px; color:var(--teal-deep);
    font-weight:800; font-size:clamp(30px,5vw,44px); letter-spacing:-.02em;
    border-bottom:2px dashed var(--teal); padding-bottom:2px; max-width:100%;
  }
  .amount input{font:inherit; color:inherit; background:transparent; border:0; outline:0; width:3ch; padding:0; letter-spacing:inherit; min-width:1ch; max-width:16ch}
  .amount:focus-within{border-bottom-style:solid}

  .mode{display:inline-flex; margin-top:20px; padding:4px; border-radius:999px; background:#eef6f5; border:1.5px solid var(--line)}
  .seg{font:inherit; font-weight:700; font-size:14px; padding:8px 16px; border:0; border-radius:999px; background:transparent; color:var(--muted); cursor:pointer; transition:background .18s}
  .seg[aria-pressed="true"]{background:var(--teal); color:var(--ink)}
  .label{font-size:15px; color:var(--muted); font-weight:600; margin:26px 0 10px}
  .sliderhead{display:flex; justify-content:space-between; align-items:baseline}
  .sliderhead strong{font-size:22px; font-weight:800; color:var(--teal-deep); letter-spacing:-.01em}
  input[type=range]{-webkit-appearance:none; appearance:none; width:100%; height:30px; background:transparent; margin:0; cursor:pointer; --p:0%}
  input[type=range]::-webkit-slider-runnable-track{height:8px; border-radius:999px; background:linear-gradient(to right,var(--teal) var(--p),var(--line) var(--p))}
  input[type=range]::-moz-range-track{height:8px; border-radius:999px; background:linear-gradient(to right,var(--teal) var(--p),var(--line) var(--p))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:28px; height:28px; border-radius:50%; background:#fff; border:3px solid var(--teal); margin-top:-10px; box-shadow:0 3px 10px rgba(6,32,31,.25)}
  input[type=range]::-moz-range-thumb{width:22px; height:22px; border-radius:50%; background:#fff; border:3px solid var(--teal); box-shadow:0 3px 10px rgba(6,32,31,.25)}
  .ticks{display:flex; justify-content:space-between; font-size:12px; font-weight:600; color:var(--muted); margin-top:2px}

  .result{
    margin-top:28px; padding:24px; border-radius:20px; background:var(--ink-2); color:#fff;
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px;
  }
  .result .cap{font-size:15px; color:#a9c4c1; font-weight:600; margin-bottom:6px}
  .result .cap sup a{color:var(--teal); text-decoration:none; font-weight:800}
  .value.m{font-size:clamp(28px,6vw,48px)}
  .value.s{font-size:clamp(22px,4.6vw,34px)}
  .value{font-size:clamp(36px,8vw,64px); font-weight:800; letter-spacing:-.03em; line-height:1; font-variant-numeric:tabular-nums; word-break:break-all}
  .gain + .gain{margin-top:4px}
  .gain{margin-top:10px; font-size:14px; color:#a9c4c1; font-weight:600; font-variant-numeric:tabular-nums}
  .badge{
    display:inline-flex; align-items:center; gap:6px; font-weight:800; font-size:17px;
    padding:8px 16px; border-radius:999px; background:rgba(45,212,191,.16); color:var(--teal);
    font-variant-numeric:tabular-nums;
  }
  .badge.neg{background:rgba(251,113,133,.16); color:#fb7185}

  .note{font-size:12px; line-height:1.6; color:var(--muted); margin:22px 0 0}
  .note sup{font-weight:800; color:var(--teal-deep)}
  :focus-visible{outline:3px solid var(--teal); outline-offset:3px}
  @media (prefers-reduced-motion: reduce){ .tickers .ico{animation:none} *{transition:none!important} }
</style>
</head>
<body>
<main class="wrap">
  <div class="tickers" id="tickers" aria-hidden="true"></div>

  <h1>Seberapa besar uangmu bisa tumbuh dengan compounding?</h1>
  <p class="sub">Bayangkan sejauh mana uangmu bisa melangkah.</p>

  <section class="card" aria-label="Kalkulator compounding">
    <div class="row">
      <span>Kalau kamu investasi...</span>
      <label class="amount" aria-label="Modal awal dalam rupiah">Rp<input id="amount" type="text" inputmode="numeric" value="1.000.000" placeholder="0" autocomplete="off"></label>
    </div>
    <div class="row">
      <span>dan rutin tiap bulan menambah...</span>
      <label class="amount" aria-label="Setoran per bulan dalam rupiah">Rp<input id="monthly" type="text" inputmode="numeric" value="500.000" autocomplete="off" placeholder="0"></label>
    </div>
    <div class="row">
      <span>dengan return per tahun...</span>
      <label class="amount" aria-label="Return per tahun dalam persen"><input id="rate" type="text" inputmode="decimal" value="10" autocomplete="off">%</label>
    </div>

    <div class="mode" role="group" aria-label="Metode perhitungan">
      <button type="button" class="seg" data-m="compound" aria-pressed="true">Compounding</button>
      <button type="button" class="seg" data-m="simple" aria-pressed="false">Tanpa compounding</button>
    </div>

    <div class="label sliderhead"><span id="lblYears">Selama</span><strong id="yearsOut">10 Tahun</strong></div>
    <input id="years" type="range" min="1" max="100" step="1" value="10" aria-labelledby="lblYears">
    <div class="ticks" aria-hidden="true"><span>1</span><span>25</span><span>50</span><span>75</span><span>100</span></div>

    <div class="result" aria-live="polite">
      <div>
        <div class="cap">Kamu sudah dapat<sup><a href="#fn1">1</a></sup></div>
        <div class="value" id="value">Rp 0</div>
        <div class="gain" id="invested"></div>
        <div class="gain" id="gain"></div>
      </div>
      <div class="badge" id="badge"></div>
    </div>

    <p class="note" id="fn1"><sup>1</sup><span id="fnText"></span></p>
  </section>
</main>

<script>
const IMG = "https://www.heygotrade.com/static/";
const TICKER_ICONS = [
  ["TSLA","4073b61adb815bb2d3bcd0a33205615a/b3f57"],["NFLX","618b2deb3ab3c8aeb49aeb59718a50ae/b3f57"],
  ["NVDA","c9a9e7df8057b6746e1c54d586b4f628/7ac50"],["AAPL","824e2a2872416fa919d1a994be49cd5f/b3f57"],
  ["META","eef66a20d2ebf7bc0deac01c2bf21f53/7ac50"],["GOOGL","2a930fb8205c4561b7688566102b3e65/b3f57"],
  ["SPOT","3ac3d609614e5d7ad3b7bbc07d9c552e/7402f"],["SBUX","8facd9c2dd185de8a8a37e0a73ef4629/046c4"],
  ["MSFT","31fe4c36a25df835f635368141dbff98/b3f57"]
];
const state = {amount:1000000, monthly:500000, rate:10, years:10, mode:'compound', shown:1000000};
const NOTES = {
  compound:'Simulasi ini menghitung bunga berbunga (compounding). Return tahunan dikonversi ke return bulanan yang setara, dan setoran bulanan diasumsikan masuk di akhir setiap bulan. Persentase dihitung terhadap total modal yang kamu setor (modal awal + semua setoran bulanan). Tidak memperhitungkan pajak, biaya, atau inflasi. Return bersifat simulasi dan tidak menjamin hasil yang sama di masa depan.',
  simple:'Simulasi ini menghitung return tanpa compounding: tiap rupiah yang disetor menghasilkan return tahunan yang sama sesuai lama ia diinvestasikan, tanpa keuntungan yang diputar kembali. Setoran bulanan diasumsikan masuk di akhir setiap bulan, dan persentase dihitung terhadap total modal yang kamu setor. Tidak memperhitungkan pajak, biaya, atau inflasi. Return bersifat simulasi dan tidak menjamin hasil yang sama di masa depan.'
};
const $ = s => document.querySelector(s);

TICKER_ICONS.forEach(([t,path])=>{
  const d = document.createElement("div"); d.className="ico";
  const img = new Image(); img.alt=""; img.src = IMG+path+"/"+t.toLowerCase()+".webp";
  img.onerror = ()=>{ img.remove(); d.textContent = t; };
  d.appendChild(img); $("#tickers").appendChild(d);
});

function parse(v){ const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : 0; }
function fit(el){ el.style.width = Math.max(1, el.value.length + 0.4) + "ch"; }

function bindMoney(id, key){
  $(id).addEventListener("input", e=>{
    const d = e.target.value.replace(/\D/g,"").slice(0,15);
    state[key] = d ? +d : 0;
    e.target.value = d ? (+d).toLocaleString("id-ID") : "";
    fit(e.target); render();
  });
}
bindMoney("#amount","amount"); bindMoney("#monthly","monthly");
$("#rate").addEventListener("input", e=>{ state.rate = Math.max(-100, parse(e.target.value)); fit(e.target); render(); });
document.querySelectorAll(".seg").forEach(b=>b.onclick=()=>{ state.mode=b.dataset.m; render(); });
$("#years").addEventListener("input", e=>{ state.years = +e.target.value; render(); });

const fmtRp = n => "Rp " + Math.round(n).toLocaleString("id-ID");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

function setValue(n){
  const t = fmtRp(n), el = $("#value");
  el.textContent = t;
  el.className = "value" + (t.length > 24 ? " s" : t.length > 15 ? " m" : "");
}
function animateTo(target){
  const from = state.shown, t0 = performance.now(), dur = reduce ? 0 : 450;
  cancelAnimationFrame(animateTo.raf);
  (function step(now){
    const k = dur ? Math.min(1,(now-t0)/dur) : 1, e = 1-Math.pow(1-k,3);
    state.shown = from + (target-from)*e;
    setValue(state.shown);
    if(k<1) animateTo.raf = requestAnimationFrame(step);
  })(t0);
}

function render(){
  const yr = $("#years");
  yr.style.setProperty("--p", ((state.years-1)/99*100) + "%");
  $("#yearsOut").textContent = state.years + " Tahun";

  document.querySelectorAll(".seg").forEach(b=>b.setAttribute("aria-pressed", b.dataset.m===state.mode));
  $("#fnText").textContent = NOTES[state.mode];
  const N = state.years*12, r = state.rate/100;
  let final;
  if(state.mode==="compound"){
    const m = Math.pow(1+r, 1/12) - 1;           // return bulanan setara
    final = state.amount*Math.pow(1+r, state.years);
    final += Math.abs(m) < 1e-12 ? state.monthly*N : state.monthly*(Math.pow(1+m, N) - 1)/m;
  } else {
    final = state.amount*(1 + r*state.years) + state.monthly*(N + r*N*(N-1)/24);
  }
  const invested = state.amount + state.monthly*N, gain = final - invested;
  const pct = invested > 0 ? gain/invested*100 : 0;
  animateTo(final);
  $("#invested").textContent = "Total modal " + fmtRp(invested);
  $("#gain").textContent = (gain < 0 ? "Kerugian " : "Keuntungan ") + fmtRp(Math.abs(gain));
  const badge = $("#badge");
  badge.classList.toggle("neg", pct < 0);
  badge.textContent = (pct < 0 ? "▼ " : "▲ ") + Math.abs(pct).toLocaleString("id-ID",{minimumFractionDigits:2, maximumFractionDigits:2}) + "% total";
}
fit($("#amount")); fit($("#monthly")); fit($("#rate")); render();
</script>
</body>
</html>
